name: dependency review

on:
  pull_request:

permissions: {}

jobs:
  dependency-review:
    concurrency:
      cancel-in-progress: true
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}

    name: Dependency review
    permissions:
      contents: read # Required to read the dependency diff

    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

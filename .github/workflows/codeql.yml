name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 0 0 * * 1

permissions: {}

jobs:
  analyze:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'main' }}
      group: ${{ github.workflow }}-${{ matrix.language }}-${{ github.event.pull_request.number || github.sha }}

    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest

    permissions:
      actions: read # Required by CodeQL to read workflow run info
      contents: read # Required to checkout the repository
      security-events: write # Required to upload CodeQL results

    strategy:
      fail-fast: false
      matrix:
        language: [typescript]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{matrix.language}}"

name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 0 0 * * 1

permissions: {}

jobs:
  analyze:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'main' }}
      group: ${{ github.workflow }}-${{ matrix.language }}-${{ github.event.pull_request.number || github.sha }}

    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest

    permissions:
      actions: read # Required by CodeQL to read workflow run info
      contents: read # Required to checkout the repository
      security-events: write # Required to upload CodeQL results

    strategy:
      fail-fast: false
      matrix:
        language: [typescript]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{matrix.language}}"
